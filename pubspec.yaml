name: voxelith
description: VOXELITH — konuşarak öğren. EN ES DE FR NL AR.
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  characters: ^1.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3
  permission_handler: ^12.0.0
  awesome_notifications: ^0.10.1
  google_mobile_ads: ^7.0.0
  home_widget: ^0.9.2+1
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.0
  audioplayers: ^6.1.0
  purchases_flutter: ^10.9.1
  google_fonts: ^8.2.1
  phosphor_flutter: ^2.1.0
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

# path_provider_foundation >=2.5.0, "objective_c" paketi üzerinden Dart'ın
# native-assets "hook" sistemini kullanıyor; objective_c'nin (9.5.0/9.6.0)
# hook/build.dart'ı Flutter 3.47.1'in hooks/code_assets protokolüyle derlenmiyor
# (Undefined name: OS/Architecture/CodeConfig vb. — hem Android hem her platform
# için, hook derlemesi hedef platform ayrımı yapmadan çalışıyor). Bu app'in
# path_provider'ı sadece audioplayers/home_widget üzerinden dolaylı kullanıyor,
# iOS/macOS build'i şu an planda yok — objective_c'ye ihtiyaç duymayan son sürüme
# (2.5.1) sabitleyip bu kırık zinciri tamamen devre dışı bırakıyoruz.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon_source.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icon_source.png"

flutter:
  uses-material-design: true
  assets:
    - assets/content/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

    - family: IBMPlexSerif
      fonts:
        - asset: assets/fonts/editorial/IBMPlexSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/editorial/IBMPlexSerif-SemiBold.ttf
          weight: 600
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/editorial/IBMPlexSans-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/editorial/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/editorial/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/editorial/NotoSansDevanagari-Variable.ttf
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/editorial/NotoSansThai-Variable.ttf
